# Forge Core — portable deployment
# Usage:
#   cp .env.example .env   (edit values)
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://forge:forge@db:5432/forge
      PORT: 5000
      NODE_ENV: production
      STORAGE_DIR: /app/storage
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - forge_storage:/app/storage
    ports:
      - "5000:5000"
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @workspace/db run push --force &&
             pnpm --filter @workspace/api-server run build &&
             node artifacts/api-server/dist/index.mjs"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forge_pgdata:
  forge_storage:
