kind = "web"
previewPath = "/"
title = "Forge Core"
version = "1.0.0"
id = "artifacts/forge-core"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25483

[services.development]
run = "pnpm --filter @workspace/forge-core run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge-core", "run", "build" ]
publicDir = "artifacts/forge-core/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25483"
BASE_PATH = "/"
