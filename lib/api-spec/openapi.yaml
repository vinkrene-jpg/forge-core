openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Forge Core API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: core
  - name: audit
  - name: ai
  - name: projects
  - name: tasks
  - name: modules
  - name: sandboxes
  - name: tests
  - name: approvals
  - name: guardian
  - name: governor
  - name: memory
  - name: improvements
  - name: dailyloop
  - name: proposals
  - name: evolution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Full dashboard overview
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /core-components:
    get:
      operationId: listCoreComponents
      tags: [core]
      summary: List locked core registry
      responses:
        "200":
          description: Core components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoreComponent"
  /core-components/{id}:
    patch:
      operationId: updateCoreComponent
      tags: [core]
      summary: Attempt to modify a core component (blocked when locked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoreComponentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreComponent"
        "403":
          description: Blocked because component is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: targetType
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /ai/providers:
    get:
      operationId: listAiProviders
      tags: [ai]
      summary: List configured AI providers and task-type routing
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
  /ai/invoke:
    post:
      operationId: invokeAi
      tags: [ai]
      summary: Invoke AI through the central gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiInvokeRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInvokeResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/calls:
    get:
      operationId: listAiCalls
      tags: [ai]
      summary: List logged AI gateway calls
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: AI call logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiCall"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /goals:
    get:
      operationId: listGoals
      tags: [projects]
      summary: List goals
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [projects]
      summary: Create goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [projects]
      summary: Update goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [projects]
      summary: Delete goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /backlog-items:
    get:
      operationId: listBacklogItems
      tags: [projects]
      summary: List backlog items
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Backlog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BacklogItem"
    post:
      operationId: createBacklogItem
      tags: [projects]
      summary: Create backlog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacklogItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogItem"
  /backlog-items/{id}:
    patch:
      operationId: updateBacklogItem
      tags: [projects]
      summary: Update backlog item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacklogItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogItem"
    delete:
      operationId: deleteBacklogItem
      tags: [projects]
      summary: Delete backlog item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /decisions:
    get:
      operationId: listDecisions
      tags: [tasks]
      summary: List decisions
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
    post:
      operationId: createDecision
      tags: [tasks]
      summary: Record decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
  /risks:
    get:
      operationId: listRisks
      tags: [tasks]
      summary: List risks
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Risks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Risk"
    post:
      operationId: createRisk
      tags: [tasks]
      summary: Create risk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risk"
  /risks/{id}:
    patch:
      operationId: updateRisk
      tags: [tasks]
      summary: Update risk
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risk"
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List modules
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
    post:
      operationId: createModule
      tags: [modules]
      summary: Create module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: Invalid manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules/{id}:
    get:
      operationId: getModule
      tags: [modules]
      summary: Get module with pipeline state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateModule
      tags: [modules]
      summary: Update module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "403":
          description: Blocked (locked core impact)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteModule
      tags: [modules]
      summary: Delete module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /modules/{id}/activate:
    post:
      operationId: activateModule
      tags: [modules]
      summary: Activate module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
  /modules/{id}/deactivate:
    post:
      operationId: deactivateModule
      tags: [modules]
      summary: Deactivate module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
  /modules/{id}/install:
    post:
      operationId: installModule
      tags: [modules]
      summary: Request module installation (runs Governor decision pipeline)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Governor decision for this install request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernorDecision"
        "403":
          description: Install blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules/{id}/rollback:
    post:
      operationId: rollbackModule
      tags: [modules]
      summary: Roll module back to previous snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          description: No snapshot available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules/{id}/snapshots:
    get:
      operationId: listModuleSnapshots
      tags: [modules]
      summary: List module snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleSnapshot"
  /modules/{id}/guardian-review:
    post:
      operationId: runGuardianReview
      tags: [guardian]
      summary: Run Guardian review on a module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Guardian review report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianReview"
  /modules/{id}/ai-guardian-review:
    post:
      operationId: runAiGuardianReview
      tags: [guardian]
      summary: Run the AI Guardian Reviewer module on a module (via the AI Gateway)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Combined AI + rules Guardian review report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianReview"
  /guardian-reviews:
    get:
      operationId: listGuardianReviews
      tags: [guardian]
      summary: List Guardian reviews
      parameters:
        - name: moduleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Guardian reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuardianReview"
  /governor-decisions:
    get:
      operationId: listGovernorDecisions
      tags: [governor]
      summary: List Governor decisions
      parameters:
        - name: moduleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Governor decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernorDecision"
  /sandboxes:
    get:
      operationId: listSandboxes
      tags: [sandboxes]
      summary: List sandboxes
      responses:
        "200":
          description: Sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sandbox"
    post:
      operationId: createSandbox
      tags: [sandboxes]
      summary: Create sandbox workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
  /sandboxes/{id}:
    get:
      operationId: getSandbox
      tags: [sandboxes]
      summary: Get sandbox with files
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSandbox
      tags: [sandboxes]
      summary: Delete sandbox completely
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /sandboxes/{id}/files:
    post:
      operationId: upsertSandboxFile
      tags: [sandboxes]
      summary: Create or update a file inside a sandbox
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxFileInput"
      responses:
        "200":
          description: File saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxFile"
        "403":
          description: Blocked (attempt to write core/protected path)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sandboxes/{id}/files/{fileId}:
    delete:
      operationId: deleteSandboxFile
      tags: [sandboxes]
      summary: Delete a sandbox file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: fileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /test-runs:
    get:
      operationId: listTestRuns
      tags: [tests]
      summary: List test runs
      parameters:
        - name: moduleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Test runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestRun"
    post:
      operationId: startTestRun
      tags: [tests]
      summary: Start a test run for a module or sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRunInput"
      responses:
        "201":
          description: Test run completed and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRun"
  /test-runs/{id}:
    get:
      operationId: getTestRun
      tags: [tests]
      summary: Get a test run with its execution steps (stdout, stderr, exit codes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Test run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approval requests
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{id}/decide:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject an approval request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: Rejection requires a reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memory-items:
    get:
      operationId: listMemoryItems
      tags: [memory]
      summary: List / search memory items
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Memory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryItem"
    post:
      operationId: createMemoryItem
      tags: [memory]
      summary: Create memory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
  /memory-items/{id}:
    delete:
      operationId: deleteMemoryItem
      tags: [memory]
      summary: Delete memory item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /improvements:
    get:
      operationId: listImprovements
      tags: [improvements]
      summary: List self-improvement backlog
      responses:
        "200":
          description: Improvements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Improvement"
    post:
      operationId: createImprovement
      tags: [improvements]
      summary: Create improvement item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImprovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Improvement"
  /improvements/{id}:
    patch:
      operationId: updateImprovement
      tags: [improvements]
      summary: Update improvement (e.g. priority)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImprovementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Improvement"
  /improvements/{id}/convert:
    post:
      operationId: convertImprovementToTask
      tags: [improvements]
      summary: Convert improvement into a module task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Task created from improvement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /daily-loop/runs:
    get:
      operationId: listDailyLoopRuns
      tags: [dailyloop]
      summary: List daily loop runs and reports
      responses:
        "200":
          description: Daily loop runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLoopRun"
  /daily-loop/run:
    post:
      operationId: startDailyLoop
      tags: [dailyloop]
      summary: Manually start the daily autonomous loop
      responses:
        "201":
          description: Loop executed, report produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLoopRun"
  /proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List change proposals
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
  /proposals/{id}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a single change proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /proposals/generate:
    post:
      operationId: generateProposal
      tags: [proposals]
      summary: Generate a code proposal in a new sandbox from a task or improvement
      description: >
        Uses the AI Gateway (task type codegeneration) to turn an existing task or
        improvement into a concrete code proposal. Generated files are written only
        into a newly created sandbox; protected core paths are always blocked. No
        installation happens — the normal chain (test runner, Guardian, Governor,
        owner approval) remains mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalGenerateInput"
      responses:
        "201":
          description: Proposal generated into a sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          description: Invalid request or AI Gateway not configured/failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source task or improvement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/introspect:
    post:
      operationId: runIntrospection
      tags: [evolution]
      summary: Analyze Forge's own codebase, database and runtime state
      description: >
        Scans the workspace read-only (source files, endpoints, database tables,
        docs, dependencies, config keys) and the database (modules, test runs,
        audit trail). Persists an introspection snapshot, rebuilds the knowledge
        graph and refreshes the capability map with fresh evidence.
      responses:
        "201":
          description: Introspection snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionSnapshot"
  /evolution/self:
    get:
      operationId: getSelfModel
      tags: [evolution]
      summary: Latest self-model snapshot
      responses:
        "200":
          description: Latest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionSnapshot"
        "404":
          description: No introspection has run yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/graph:
    get:
      operationId: getKnowledgeGraph
      tags: [evolution]
      summary: Knowledge graph from the latest introspection snapshot
      responses:
        "200":
          description: Nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"
        "404":
          description: No introspection has run yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/capabilities:
    get:
      operationId: listCapabilities
      tags: [evolution]
      summary: Capability map with status, maturity and evidence
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
  /evolution/gaps:
    get:
      operationId: getGapAnalysis
      tags: [evolution]
      summary: Ranked gap analysis over the capability map
      responses:
        "200":
          description: Gap analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapAnalysis"
  /evolution/plan:
    post:
      operationId: createEvolutionPlan
      tags: [evolution]
      summary: Autonomously plan the next development step for the top gap
      description: >
        Picks the highest-impact gap (or the given capability key), and produces a
        plan with design, steps, affected files, risk, priority, test strategy and
        rollback strategy. Uses the AI Gateway (task type planning) when
        configured, with a deterministic rule-based fallback otherwise. Creates a
        backlog task linked to the plan so the Proposal Generator can pick it up.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolutionPlanInput"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionPlan"
        "400":
          description: No gaps to plan or invalid capability key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/plans:
    get:
      operationId: listEvolutionPlans
      tags: [evolution]
      summary: List evolution plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionPlan"
  /evolution/run:
    post:
      operationId: startEvolutionRun
      tags: [evolution]
      summary: Execute one full self-evolution iteration
      description: >
        Runs the loop introspect → gap analysis → plan → task → proposal
        (sandbox) → real test run → Guardian review → Governor decision → lessons
        stored in memory → next-step recommendation. Never installs anything by
        itself; installation stays behind the existing governance pipeline. If no
        AI provider is configured the run stops after planning with a clear
        blocked status.
      responses:
        "201":
          description: Evolution run finished (completed or blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionRun"
  /evolution/runs:
    get:
      operationId: listEvolutionRuns
      tags: [evolution]
      summary: List evolution runs
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionRun"
  /evolution/status:
    get:
      operationId: getEvolutionStatus
      tags: [evolution]
      summary: Current self-evolution status overview
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        storage:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DashboardSummary:
      type: object
      required:
        - projects
        - activeTasks
        - blockedTasks
        - sandboxes
        - modules
        - activeModules
        - pendingApprovals
        - failedTests
        - improvements
        - memoryItems
        - recentAuditLogs
        - lockedCoreCount
        - lastDailyReport
      properties:
        projects: { type: integer }
        activeTasks: { type: integer }
        blockedTasks: { type: integer }
        sandboxes: { type: integer }
        modules: { type: integer }
        activeModules: { type: integer }
        pendingApprovals: { type: integer }
        failedTests: { type: integer }
        improvements: { type: integer }
        memoryItems: { type: integer }
        lockedCoreCount: { type: integer }
        lastDailyReport: { type: ["string", "null"] }
        recentAuditLogs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    CoreComponent:
      type: object
      required: [id, key, name, locked, version]
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        locked: { type: boolean }
        version: { type: string }
    CoreComponentUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: string }
    AuditLog:
      type: object
